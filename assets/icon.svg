<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#6a3dff"/>
    </linearGradient>
  </defs>
  <!-- base layer -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- top sheen layer -->
  <ellipse cx="256" cy="120" rx="220" ry="120" fill="#ffffff" opacity="0.08"/>
  <!-- code motif layer (upper third): </>  -->
  <g stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="196,128 146,168 196,208"/>
    <polyline points="316,128 366,168 316,208"/>
    <line x1="272" y1="120" x2="240" y2="216"/>
  </g>
  <!-- stacked tool layers (bottom-weighted so the mark sits low/grounded at taskbar sizes) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="136,296 256,352 376,296" stroke-width="32" opacity="0.45"/>
    <polyline points="136,352 256,408 376,352" stroke-width="32" opacity="0.7"/>
    <polyline points="136,408 256,464 376,408" stroke-width="32" opacity="1"/>
  </g>
</svg>
